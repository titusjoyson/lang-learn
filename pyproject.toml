[project]
name = "lang-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Titus Joyson", email = "tj.joyson@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
